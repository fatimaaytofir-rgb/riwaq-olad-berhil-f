<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة - بوابة برحيل</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
:root{--green:#174d3c;--deep:#10392d;--gold:#c49a52;--bg:#f7f6f1;--ink:#202a24;--muted:#78847b;--line:#e8e9e2;--red:#c53030;--green-btn:#2f855a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif}
header{background:var(--deep);color:white;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:1180px;margin:auto;padding:30px 20px}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.btn{border:0;border-radius:6px;padding:8px 14px;background:var(--green);color:white;font-weight:600;cursor:pointer}
.btn.danger{background:var(--red)}
.btn.success{background:var(--green-btn)}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:12px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--green);background:#f0f411}
.badge{padding:4px 8px;border-radius:4px;font-size:12px;font-weight:600}
.badge.pending{background:#feebc8;color:#9c4221}
.badge.approved{background:#c6f6d5;color:#22543d}
.badge.rejected{background:#fed7d7;color:#9b2c2c}
.login-box{max-width:400px;margin:80px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.05)}
.field{margin-bottom:15px}.field label{display:block;margin-bottom:5px;font-size:13px}
.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px}
</style>
</head>
<body>

<div id="loginSection" class="login-box">
 <h2>تسجيل دخول الإدارة</h2>
 <form id="loginForm">
  <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" required></div>
  <div class="field"><label>كلمة المرور</label><input type="password" id="password" required></div>
  <button class="btn" type="submit" style="width:100%">دخول</button>
 </form>
</div>

<div id="adminSection" style="display:none">
 <header>
  <h2>لوحة تحكم بوابة برحيل</h2>
  <button class="btn danger" onclick="logout()">تسجيل الخروج</button>
 </header>
 <div class="wrap">
  <div class="card">
   <h3>الطلبات المعلقة والمحتوى</h3>
   <p>مراجعة الكتب والمبادرات والطلبات الواردة من الزوار:</p>
   <div id="requestsList">جاري التحميل...</div>
  </div>
 </div>
</div>

<script>
// رابط المصادقة والـ Login الصحيح الخاص بـ Xano Auth Group
const XANO_AUTH_API = 'https://x8ki-letl-twmt.n7.xano.io/api:SWI8GzGl';
// رابط البيانات والـ Endpoints الخاصة ببوابة برحيل
const XANO_DATA_API = 'https://x8ki-letl-twmt.n7.xano.io/api:bourhiril';

let authToken = localStorage.getItem('bourhiril_admin_token') || '';

if(authToken) {
  showAdmin();
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    let res = await fetch(XANO_AUTH_API + '/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    let data = await res.json();
    if(res.ok && data.authToken) {
      authToken = data.authToken;
      localStorage.setItem('bourhiril_admin_token', authToken);
      showAdmin();
    } else {
      alert('فشل تسجيل الدخول. تحقق من البريد وكلمة المرور.');
    }
  } catch(err) {
    alert('حدث خطأ في الاتصال بالخادم.');
  }
});

function logout() {
  localStorage.removeItem('bourhiril_admin_token');
  authToken = '';
  document.getElementById('adminSection').style.display = 'none';
  document.getElementById('loginSection').style.display = 'block';
}

function showAdmin() {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('adminSection').style.display = 'block';
  loadRequests();
}

async function loadRequests() {
  const container = document.getElementById('requestsList');
  try {
    let [booksRes, initRes] = await Promise.all([
      fetch(XANO_DATA_API + '/books', {headers: {'Authorization': 'Bearer ' + authToken}}),
      fetch(XANO_DATA_API + '/initiatives', {headers: {'Authorization': 'Bearer ' + authToken}})
    ]);
    let books = await booksRes.json();
    let initiatives = await initRes.json();
    
    let all = [];
    if(Array.isArray(books)) books.forEach(b => all.push({...b, table: 'books'}));
    if(Array.isArray(initiatives)) initiatives.forEach(i => all.push({...i, table: 'initiatives'}));

    if(!all.length) {
      container.innerHTML = '<p>لا توجد طلبات حالياً.</p>';
      return;
    }

    let html = `<table><thead><tr><th>النوع / العنوان</th><th>التفاصيل</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>`;
    for(let item of all) {
      html += `<tr>
        <td><strong>${item.table === 'books' ? 'كتاب: ' : 'مبادرة: '}</strong>${item.title}</td>
        <td>${item.author || item.organizer || ''} - ${item.category || item.kind || ''}</td>
        <td><span class="badge ${item.status}">${item.status}</span></td>
        <td>
          ${item.status !== 'approved' ? `<button class="btn success" onclick="updateStatus('${item.table}', ${item.id}, 'approved')">موافقة</button>` : ''}
          ${item.status !== 'rejected' ? `<button class="btn danger" onclick="updateStatus('${item.table}', ${item.id}, 'rejected')">رفض</button>` : ''}
        </td>
      </tr>`;
    }
    html += `</tbody></table>`;
    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = '<p>تعذر جلب الطلبات.</p>';
  }
}

async function updateStatus(table, id, status) {
  try {
    let res = await fetch(XANO_DATA_API + '/' + table + '/' + id, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ status })
    });
    if(res.ok) {
      loadRequests();
    } else {
      alert('تعذر تحديث الحالة.');
    }
  } catch(e) {
    alert('حدث خطأ في الاتصال.');
  }
}
</script>
</body>
</html>
